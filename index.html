<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
    <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
    <title>Tra cứu Công an phường Nam Định</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20260606-gradient-call">
    <script defer src="data.sample.js"></script>
    <script defer src="app.js?v=20260606-format-only"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="top-app-bar">
        <h1>Công an phường Nam Định</h1>
      </header>

      <section class="support-rail">
        <section class="support-card" aria-label="Liên hệ hỗ trợ">
          <svg class="support-card__icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 8h.01"></path>
            <path d="M11 12h1v5h1"></path>
          </svg>
          <p>
            Quá trình sử dụng có lỗi phát sinh vui lòng liên hệ:<br>
            <strong>Đ/C Tuân CSKV: 0899.636.838</strong>
          </p>
        </section>
      </section>

      <section class="content-panel">
        <section class="status-row" aria-live="polite">
          <span id="resultMeta">Đang tải dữ liệu...</span>
        </section>

        <section id="results" class="results" aria-label="Kết quả tra cứu"></section>
      </section>

      <div class="bottom-nav">
        <form class="search-bar" id="searchForm" role="search">
          <button class="search-button" type="submit" aria-label="Tìm kiếm">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M16.5 16.5 21 21"></path>
            </svg>
          </button>
          <label class="sr-only" for="searchInput">Tìm kiếm theo tên gọi hoặc địa chỉ</label>
          <input id="searchInput" name="q" type="search" placeholder="Tìm kiếm..." autocomplete="off">
          <button class="clear-search" id="clearSearch" type="button" aria-label="Xóa nội dung tìm kiếm">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
          </button>
        </form>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>
  </body>
</html>
